name: Verificação contínua

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edutrack_test
          POSTGRES_USER: edutrack
          POSTGRES_PASSWORD: edutrack_test
        options: >-
          --health-cmd "pg_isready -U edutrack -d edutrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+psycopg://edutrack:edutrack_test@127.0.0.1:5432/edutrack_test
      JWT_SECRET: ci-secret-with-at-least-thirty-two-characters
      SMTP_USERNAME: tests@example.com
      SMTP_PASSWORD: not-a-real-password
      SMTP_FROM_EMAIL: tests@example.com
      FRONTEND_URL: http://127.0.0.1:8000
      COOKIE_SECURE: "false"

    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -e ".[dev]"

      - name: Aplicar migrações
        run: python -m alembic upgrade head

      - name: Executar testes automatizados
        run: python -m pytest -p no:cacheprovider --ignore=tests/e2e

      - name: Verificar estilo e erros estáticos
        run: python -m ruff check --no-cache app scripts tests alembic
